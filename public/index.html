<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InternHub • Discover Projects & Internships</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="min-h-screen bg-white text-gray-900">
  <div id="navbar"></div>

  <main>
    <!-- Hero -->
    <section class="bg-gradient-to-b from-indigo-50 to-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-24">
        <div class="max-w-3xl">
          <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-gray-900">Kickstart your journey with real-world projects and internships</h1>
          <p class="mt-4 text-lg text-gray-600">Search and explore curated challenges and roles to build your skills and portfolio.</p>

          <div class="mt-8 bg-white p-2 rounded-lg shadow-sm border border-gray-200">
            <div class="flex flex-col sm:flex-row gap-2">
              <input id="home-search" type="text" placeholder="Search projects or internships..." class="flex-1 px-4 py-3 rounded-md border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <button id="home-search-btn" class="px-5 py-3 rounded-md bg-indigo-600 text-white hover:bg-indigo-700">Search</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Featured -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold">Featured Projects</h2>
        <a href="/projects.html" class="text-indigo-600 hover:text-indigo-700 text-sm">View all</a>
      </div>
      <div id="featured-projects" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold">Featured Internships</h2>
        <a href="/internships.html" class="text-indigo-600 hover:text-indigo-700 text-sm">View all</a>
      </div>
      <div id="featured-internships" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script type="module">
    import { db, collection, getDocs, query, orderBy, limit } from '/assets/js/firebase.js';
    import '/assets/js/main.js';

    // Render a project card
    function projectCard(id, data) {
      const tags = Array.isArray(data.tags) ? data.tags.slice(0, 3) : [];
      return `
      <a href="/project-detail.html?id=${id}" class="block border border-gray-200 rounded-lg p-5 hover:shadow-md transition">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">${data.name || 'Untitled Project'}</h3>
          <span class="text-xs px-2 py-1 rounded bg-indigo-50 text-indigo-700">${data.difficulty || 'N/A'}</span>
        </div>
        <p class="mt-2 text-sm text-gray-600 line-clamp-3">${data.short_description || ''}</p>
        <div class="mt-3 flex flex-wrap gap-2">${tags.map(t => `<span class='text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded'>${t}</span>`).join('')}</div>
      </a>`;
    }

    // Render an internship card
    function internshipCard(id, data) {
      return `
      <div class="border border-gray-200 rounded-lg p-5 hover:shadow-md transition">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">${data.name || 'Untitled Internship'}</h3>
          <span class="text-xs px-2 py-1 rounded bg-emerald-50 text-emerald-700">${data.duration || 'N/A'}</span>
        </div>
        <p class="mt-2 text-sm text-gray-600 line-clamp-3">${data.description || ''}</p>
      </div>`;
    }

    async function loadFeatured() {
      try {
        const projQ = query(collection(db, 'projects'), orderBy('created_at', 'desc'), limit(6));
        const internQ = query(collection(db, 'internships'), orderBy('created_at', 'desc'), limit(6));
        const [projSnap, internSnap] = await Promise.all([getDocs(projQ), getDocs(internQ)]);

        const projContainer = document.getElementById('featured-projects');
        projContainer.innerHTML = projSnap.docs.map(d => projectCard(d.id, d.data())).join('') || '<p class="text-sm text-gray-500">No projects yet.</p>';

        const internContainer = document.getElementById('featured-internships');
        internContainer.innerHTML = internSnap.docs.map(d => internshipCard(d.id, d.data())).join('') || '<p class="text-sm text-gray-500">No internships yet.</p>';
      } catch (e) {
        console.error(e);
      }
    }

    // Simple search redirects to projects/internships with query param
    function initHomeSearch() {
      const input = document.getElementById('home-search');
      const btn = document.getElementById('home-search-btn');
      const go = () => {
        const q = encodeURIComponent(input.value.trim());
        if (!q) { window.location.href = '/projects.html'; return; }
        window.location.href = `/projects.html?search=${q}`;
      };
      btn.addEventListener('click', go);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    }

    loadFeatured();
    initHomeSearch();
  </script>
</body>
</html>
